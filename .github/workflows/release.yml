name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
            aot-deps: true
            archive-ext: tar.gz
          - rid: linux-arm64
            os: ubuntu-latest
            aot-deps: true
            archive-ext: tar.gz
          - rid: win-x64
            os: windows-latest
            aot-deps: false
            archive-ext: zip
          - rid: osx-x64
            os: macos-latest
            aot-deps: false
            archive-ext: tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Install Native AOT Dependencies (Linux)
        if: matrix.aot-deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev
          if [ "${{ matrix.rid }}" = "linux-arm64" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
            # The native objcopy on x64 can't handle ARM64 binaries.
            # Use the cross-toolchain's aarch64-linux-gnu-objcopy instead.
            sudo update-alternatives --install /usr/bin/objcopy objcopy /usr/bin/aarch64-linux-gnu-objcopy 100
          fi

      - name: Publish Native AOT Binary
        run: |
          $releaseVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          dotnet publish src/Sshocked/Sshocked.csproj `
            -c Release `
            -r ${{ matrix.rid }} `
            -p:Version=$releaseVersion `
            --self-contained true `
            -o ./publish
        shell: pwsh

      - name: Verify Native Release Version
        if: matrix.rid != 'linux-arm64'
        shell: pwsh
        run: |
          $env:SSHOCKED_CONFIG_DIR = Join-Path $env:RUNNER_TEMP 'sshocked-release-version'
          $binary = if ($IsWindows) { './publish/ssk.exe' } else { './publish/ssk' }
          $expected = 'sshocked version ' + ($env:GITHUB_REF_NAME -replace '^v', '')
          $actual = & $binary --version
          if ($LASTEXITCODE -ne 0 -or ($actual -join "`n").Trim() -ne $expected) {
            throw "Release binary reported an unexpected version: $actual"
          }

      - name: Package Binary (tar.gz)
        if: matrix.archive-ext == 'tar.gz'
        run: |
          cd ./publish
          tar -czvf ../sshocked-${{ matrix.rid }}.tar.gz ssk

      - name: Package Binary (zip)
        if: matrix.archive-ext == 'zip'
        run: |
          Compress-Archive -Path ./publish/ssk.exe -DestinationPath sshocked-${{ matrix.rid }}.zip
        shell: pwsh

      - name: Build .deb Package (Linux)
        if: startsWith(matrix.rid, 'linux-')
        run: |
          # Determine architecture for .deb
          case "${{ matrix.rid }}" in
            linux-x64)   DEB_ARCH="amd64" ;;
            linux-arm64) DEB_ARCH="arm64" ;;
          esac

          # Extract version from tag (strip leading 'v')
          VERSION="${GITHUB_REF_NAME#v}"

          PKG_DIR="$(mktemp -d)"
          mkdir -p "${PKG_DIR}/DEBIAN"
          mkdir -p "${PKG_DIR}/usr/local/bin"

          # Copy the binary
          cp ./publish/ssk "${PKG_DIR}/usr/local/bin/ssk"

          # Generate control file
          cat > "${PKG_DIR}/DEBIAN/control" <<-EOF
          Package: ssk
          Version: ${VERSION}
          Section: net
          Priority: optional
          Architecture: ${DEB_ARCH}
          Maintainer: ms-sk
          Description: Shell into servers and containers with lightning speed
           A fast, interactive terminal UI for managing and connecting to SSH
           servers and containers. Organize hosts into groups, import from
           OpenSSH config, and launch SSH sessions.
          EOF

          # Build the .deb
          dpkg-deb --build "${PKG_DIR}" "sshocked-${{ matrix.rid }}.deb"

      - name: Upload Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sshocked-${{ matrix.rid }}
          path: |
            sshocked-${{ matrix.rid }}.${{ matrix.archive-ext }}
            sshocked-${{ matrix.rid }}.deb

  create-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1

      - name: Download All Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: ./artifacts

      - name: Attach Install Scripts
        run: |
          cp install.sh ./artifacts/install.sh
          cp install.ps1 ./artifacts/install.ps1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
